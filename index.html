<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khảo Sát & Báo Cáo Thị Trường</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">
  <div class="max-w-2xl mx-auto bg-white min-h-screen sm:min-h-0 sm:my-6 sm:rounded-2xl shadow-md overflow-hidden">
    <!-- Top Header + Góc chuyển chế độ Khảo sát / Báo cáo -->
    <div class="bg-slate-900 text-white px-4 py-3.5 flex items-center justify-between gap-2">
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight">Khảo Sát & Báo Cáo Thị Trường</h1>
        <p class="text-[11px] sm:text-xs text-slate-300">Dầu mỡ, nước làm mát, nước rửa kính & hóa chất gara</p>
      </div>
      <div class="flex items-center bg-slate-800 p-1 rounded-xl shrink-0">
        <button type="button" id="tabSurveyBtn"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition">
          Khảo sát
        </button>
        <button type="button" id="tabReportBtn"
          class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition">
          Báo cáo
        </button>
      </div>
    </div>

    <!-- ==================== VIEW 1: FORM KHẢO SÁT ==================== -->
    <div id="surveyView" class="p-4 sm:p-5">
      <form id="surveyForm" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Nhân viên khảo sát <span class="text-red-500">*</span></label>
            <input type="text" id="nhanVien" required placeholder="Nhập họ tên nhân viên..."
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Tên gara / cửa hàng / xưởng <span class="text-red-500">*</span></label>
            <input type="text" id="tenCuaHang" required placeholder="VD: Gara sửa chữa ô tô Thành Đạt..."
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>
        </div>

        <!-- Địa chỉ & GPS -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-600 uppercase">Vị trí GPS & Địa chỉ</span>
            <button type="button" id="btnGetLocation"
              class="text-xs bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-md font-medium active:bg-blue-100">
              Lấy lại GPS
            </button>
          </div>
          <div id="gpsStatus" class="text-xs text-slate-500">Đang lấy tọa độ GPS...</div>
          <input type="text" id="diaChi" placeholder="Địa chỉ tự động hoặc nhập/sửa nhanh..."
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          <input type="hidden" id="lat" />
          <input type="hidden" id="lng" />
        </div>

        <!-- Ảnh chụp thực tế -->
        <div>
          <label class="block text-sm font-semibold mb-1">Ảnh chụp thực tế (đóng dấu ngày giờ + GPS) <span class="text-red-500">*</span></label>
          <label class="flex flex-col items-center justify-center border-2 border-dashed border-blue-300 bg-blue-50/50 hover:bg-blue-50 rounded-xl p-4 cursor-pointer transition">
            <span class="text-sm font-medium text-blue-700">Chạm để mở Camera chụp ảnh</span>
            <span class="text-xs text-slate-500 mt-1">Chụp mặt tiền, kệ nhớt hoặc khu rửa xe</span>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
          </label>

          <div id="previewBox" class="mt-3 hidden">
            <img id="previewImg" alt="Ảnh xem trước" class="w-full max-h-80 object-contain rounded-xl border border-slate-200 bg-slate-50" />
            <p id="imgInfo" class="text-[11px] text-slate-500 mt-1"></p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Chủ cơ sở / Người mua hàng & SĐT</label>
            <input type="text" id="lienHe" placeholder="VD: Anh Minh - 098xxxxxxx"
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600" />
          </div>

          <!-- Loại hình điểm khảo sát -->
          <div>
            <label class="block text-sm font-semibold mb-1">Loại hình điểm khảo sát <span class="text-red-500">*</span></label>
            <select id="loaiHinhSelect" required
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
              <option value="">-- Chọn loại hình --</option>
              <option value="Gara sửa chữa ô tô">Gara sửa chữa ô tô</option>
              <option value="Tiệm sửa & rửa xe máy">Tiệm sửa & rửa xe máy</option>
              <option value="Trung tâm rửa xe / Detailing">Trung tâm rửa xe / Detailing</option>
              <option value="Cửa hàng phụ tùng / Dầu nhớt">Cửa hàng phụ tùng / Dầu nhớt</option>
              <option value="Xưởng / Nhà máy / Vận tải">Xưởng / Nhà máy / Vận tải</option>
              <option value="Khác">Khác (bắt buộc nhập tay)</option>
            </select>
          </div>
        </div>

        <!-- Ô nhập tay khi chọn Khác (bắt buộc, chống điền dấu . đối phó) -->
        <div id="loaiHinhKhacBox" class="hidden bg-amber-50/70 border border-amber-300 rounded-xl p-3">
          <label class="block text-sm font-semibold text-amber-900 mb-1">
            Nhập rõ loại hình điểm khảo sát <span class="text-red-500">*</span>
          </label>
          <input type="text" id="loaiHinhKhacInput" placeholder="VD: Trạm dừng nghỉ, HTX vận tải, Bãi xe container..."
            class="w-full rounded-lg border border-amber-400 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
          <p class="text-[11px] text-amber-800 mt-1">Ghi rõ tên loại hình thực tế (không nhập dấu chấm hay ký tự đối phó).</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block
